<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Risk’em Live Entry</title>
    <link rel="stylesheet" href="./assets/riskem.css?v=20260711-lockmode1" />
  </head>
  <body data-page="submit">
    <div class="wrap">
      <header class="hero">
        <div class="kicker" id="heroKicker">Risk’em Live</div>
        <h1 id="heroTitle">Risk’em Live</h1>
        <p class="sub" id="heroSub"></p>
        <div class="top-actions">
          <a class="mini-link" id="scoreboardLink" href="./scoreboard.html">Scoreboard</a>
          <label style="display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:14px;color:#fff;font-weight:900;">
            Event
            <select id="eventSelect" style="min-width:190px;border-radius:999px;padding:9px 12px"></select>
          </label>
        </div>
      </header>

      <div class="notice" id="publicNote" style="margin-top:14px"></div>
      <section class="panel hide" id="oddsPanel">
        <div class="section-head"><div><h2>Odds Board</h2><div class="hint" id="oddsHint">FanDuel / DraftKings / AVG lines.</div></div></div>
        <div class="odds-grid" id="oddsBoard"></div>
      </section>
      <main id="entryForm"></main>
    </div>

    <script src="./sports/soccer.js?v=20260711-lockmode1"></script>
    <script src="./sports/combat.js?v=20260711-lockmode1"></script>
    <script src="./sports/football.js?v=20260711-lockmode1"></script>
    <script src="./sports/racing.js?v=20260711-lockmode1"></script>
    <script src="./assets/odds-tools.js?v=20260711-lockmode1"></script>
    <script src="./events/f8wc-quarterfinals.js?v=20260711-lockmode1"></script>
    <script src="./events/ufc-324.js?v=20260711-lockmode1"></script>
    <script src="./events/odds/ufc-324-odds.js?v=20260711-lockmode1"></script>
    <script src="./events/nfl-week-template.js?v=20260711-lockmode1"></script>
    <script src="./events/boxing-card-template.js?v=20260711-lockmode1"></script>
    <script src="./events/racing-template.js?v=20260711-lockmode1"></script>
    <script src="./assets/riskem-core.js?v=20260711-lockmode1"></script>
  </body>
</html>
